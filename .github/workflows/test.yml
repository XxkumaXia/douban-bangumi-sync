name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # package-lock.json 在仓库里，用 ci 保证装的版本和本地一致
      - run: npm ci

      - name: 全量回归
        run: npm test

      - name: 语法检查
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
